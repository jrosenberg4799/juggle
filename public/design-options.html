<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juggle · Five design options</title><style>:root{color-scheme:light dark}body{margin:0;background:light-dark(#e6ebf2,#0b1017);color:light-dark(#142033,#f4f7ff);font-family:Arial,sans-serif}.concept-controls{padding:24px;max-width:1100px;margin:auto}.concept-controls strong{font-size:24px}.concept-controls p{font-size:14px;line-height:1.6}.concept-controls nav{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.concept-controls button{font:inherit;font-weight:700;font-size:14px;min-height:48px;padding:12px 16px;border:2px solid light-dark(#c0cadb,#465472);background:light-dark(#fff,#1c2534);color:inherit;border-radius:7px;cursor:pointer}.concept-controls button[aria-pressed=true]{background:#1749e6;border-color:#1749e6;color:#fff}.concept-controls a{font-size:14px;color:inherit}#juggle-five-mocks{max-width:1100px;margin:0 auto 35px}#juggle-five-mocks>section[hidden]{display:none!important}#juggle-five-mocks .jm-product{min-height:650px}@media(max-width:700px){.concept-controls{padding:20px 16px}.concept-controls nav{display:grid;grid-template-columns:1fr 1fr}.concept-controls button{text-align:left}.concept-controls button:last-child{grid-column:1/-1}}</style></head><body><div class="concept-controls"><div><strong>Juggle · Five design options</strong><p>Choose an option, then try its Next button and role selector. These are mockups, not the live database.</p></div><nav aria-label="Choose a design"><button type="button" data-concept="0" aria-pressed="true">1. One big next step</button><button type="button" data-concept="1" aria-pressed="false">2. Traffic light</button><button type="button" data-concept="2" aria-pressed="false">3. Job ticket</button><button type="button" data-concept="3" aria-pressed="false">4. Now, next, done</button><button type="button" data-concept="4" aria-pressed="false">5. Guided route</button></nav><a href="/">Back </div>
<style>

#juggle-five-mocks .jm-product button{font:inherit;cursor:pointer;min-height:var(--j-target);border:1px solid var(--j-line);border-radius:var(--j-radius);padding:12px 18px;font-weight:700;color:var(--j-ink);background:var(--j-paper);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}

#juggle-five-mocks .jm-signal.red{background:var(--j-red-bg);color:var(--j-red)}
#juggle-five-mocks .jm-signal.amber{background:var(--j-amber-bg);color:var(--j-amber)}

#juggle-five-mocks .jm-lanes{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px}
#juggle-five-mocks .jm-lane{padding:20px;background:var(--j-paper);border:1px solid var(--j-line);border-radius:7px}
#juggle-five-mocks .jm-lane-label{display:flex;align-items:center;justify-content:space-between;padding-bottom:13px;border-bottom:4px solid var(--j-blue);font-size:12px;font-weight:900;margin-bottom:20px}
#juggle-five-mocks .jm-lane.next .jm-lane-label{border-color:var(--j-line);color:var(--j-muted)}

#juggle-five-mocks .jm-station.current>span{background:var(--j-blue);border-color:var(--j-blue);color:var(--j-on-blue)}

#juggle-five-mocks .jm-choice-status{min-height:28px;font-size:13px;color:var(--j-blue);font-weight:700}

#juggle-five-mocks .jm-alert-detail{padding:22px;border:2px solid var(--j-red);background:var(--j-paper);margin-bottom:22px}
#juggle-five-mocks .jm-alert-detail .jm-status{color:var(--j-red);background:var(--j-red-bg)}
#juggle-five-mocks .jm-hidden{display:none!important}
@media(max-width:700px){#juggle-five-mocks .jm-product{min-height:980px}#juggle-five-mocks .jm-header{padding:16px;align-items:flex-start}#juggle-five-mocks .jm-header-right{justify-content:flex-end;gap:8px}#juggle-five-mocks .jm-local{font-size:10px}#juggle-five-mocks .jm-main{padding:20px 16px}#juggle-five-mocks .jm-product h1{font-size:31px}#juggle-five-mocks .jm-action{padding:21px 17px}#juggle-five-mocks .jm-form{grid-template-columns:1fr}#juggle-five-mocks .jm-priority{grid-template-columns:1fr}#juggle-five-mocks .jm-signal-stack{flex-direction:row;gap:8px}#juggle-five-mocks .jm-signal{flex:1;padding:12px;font-size:10px}#juggle-five-mocks .jm-signal strong{font-size:20px}#juggle-five-mocks .jm-lanes{grid-template-columns:1fr}#juggle-five-mocks .jm-lane.next,#juggle-five-mocks .jm-lane.done{padding:16px}#juggle-five-mocks .jm-lane.next h2,#juggle-five-mocks .jm-lane.done h2{font-size:17px}#juggle-five-mocks .jm-lane.next p,#juggle-five-mocks .jm-lane.done p{margin-bottom:0}#juggle-five-mocks .jm-route{grid-template-columns:1fr}#juggle-five-mocks .jm-stations{flex-direction:row;gap:10px}#juggle-five-mocks .jm-station{display:flex;flex:1;flex-direction:column;min-height:0;padding:0 0 12px;gap:6px}#juggle-five-mocks .jm-station:after{display:none}#juggle-five-mocks .jm-station small{display:none}#juggle-five-mocks .jm-station strong{font-size:11px}#juggle-five-mocks .jm-ticket-body{padding:22px 18px}#juggle-five-mocks .jm-urgent{flex-wrap:wrap}#juggle-five-mocks .jm-db{grid-template-columns:1fr}#juggle-five-mocks .jm-check-options{grid-template-columns:1fr}#juggle-five-mocks .jm-check-options button{min-height:72px}#juggle-five-mocks .jm-next .jm-primary{width:100%}#juggle-five-mocks .jm-product input{font-size:16px}#juggle-five-mocks .jm-bottom{align-items:flex-start;flex-direction:column}}
</style>
<script>
(()=>{
const root=document.getElementById('juggle-five-mocks');
const designs={focus:'One big next step',signal:'Traffic light',ticket:'Job ticket',lanes:'Now, next, done',route:'Guided route'};
const saved=window.openai?.widgetState?.privateContent||{};
const states={};
const styleStates={};
function remember(preferred){const privateContent={};for(const key of Object.keys(designs)){const s=states[key];privateContent[key]={role:s.role,step:s.step,answer:s.answer,urgent:s.urgent};}if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:preferred?{preferredDirection:preferred}:null,privateContent}).catch(()=>{});}
function detail(s){return `<details><summary>View the full record — contacts, files & history</summary><div class="jm-db"><div><label>Restaurant record</label><strong>Mercer Kitchen · REST-0042</strong></div><div><label>Equipment record</label><strong>Walk-in refrigerator · EQ-0017</strong></div><div><label>Room</label><strong>Kitchen → Cold storage</strong></div><div><label>Owner / contact</label><strong>Fictional Hospitality · Alex, site manager</strong></div><div><label>Files</label><strong>Floor plan · Nameplate photo · Repair evidence</strong></div><div><label>Latest activity</label><strong>Inspection → Request → Assignment → Review</strong></div><div class="wide"><label>Where the real app saves</label><strong>Records: Supabase database · Images/PDFs: private object storage · This preview saves no real records.</strong></div></div></details>`;}
function header(s){return `<header class="jm-header"><span class="jm-brand">juggle.</span><div class="jm-header-right"><span class="jm-local">MOCK · NO REAL SAVES</span><label>Working as<select data-action="role" aria-label="Choose role"><option ${s.role==='Director'?'selected':''}>Director</option><option ${s.role==='Manager'?'selected':''}>Manager</option><option ${s.role==='Subcontractor'?'selected':''}>Subcontractor</option></select></label></div></header>`;}
function strip(s){const names=s.role==='Director'?['Register restaurant','Capture equipment','Assign Manager']:s.role==='Manager'?['Check appliance','Record finding','Send to Director']:['Start job','Document work','Send for approval'];return `<div class="jm-step-strip">${names.map((n,i)=>`<span class="${i===s.step?'current':i<s.step?'done':''}">${i<s.step?'✓':i+1} ${n}</span>`).join('')}</div>`;}
function content(s){if(s.role==='Director'){if(s.step===0)return {tag:'DIRECTOR · STEP 1 OF 3',title:'Register the restaurant.',body:'Four details. Then your QR label is ready.',form:`<div class="jm-form"><label>Restaurant name<input aria-label="Restaurant name" value="Mercer Kitchen"></label><label>Owner / company<input aria-label="Owner or company" value="Fictional Hospitality"></label><label>Contact name<input aria-label="Contact name" value="Alex, site manager"></label><label>Contact email<input aria-label="Contact email" type="email" value="alex@example.com"></label></div>`,cta:'Save restaurant & get QR →',next:'Next: photograph the equipment.'};if(s.step===1)return {tag:'DIRECTOR · STEP 2 OF 3',title:'Capture the equipment.',body:'Go room by room. Take a photo and enter the name.',form:`<div class="jm-status">✓ Restaurant registered · QR ready</div><div class="jm-form"><label>Room<input value="Kitchen" aria-label="Room"></label><label>Appliance name<input value="Walk-in refrigerator" aria-label="Appliance name"></label></div><p>Photo, make/model and the care plan stay attached to this appliance.</p>`,cta:'Add appliance & continue →',next:'Next: hand the inspection schedule to the Manager.'};return {tag:'DIRECTOR · STEP 3 OF 3',title:'Assign the Manager.',body:'Choose who checks this kitchen and when they start.',form:`<div class="jm-form"><label>Manager<input aria-label="Manager name" value="Alex"></label><label>Inspection schedule<input aria-label="Inspection schedule" value="Every Monday"></label></div><div class="jm-status">Restaurant → Kitchen → Refrigerator linked</div>`,cta:'Open Manager walkthrough →',next:'The Manager checks. You review the exceptions.'};}
if(s.role==='Manager'){const names=['Walk-in refrigerator','Gas range','Weekly check complete'];return {tag:`MANAGER · ${s.step<2?'APPLIANCE '+(s.step+1)+' OF 2':'READY TO SEND'}`,title:names[s.step],body:s.step<2?'Kitchen · Is this equipment okay?':'Your findings go to the Director. Repairs need their decision.',form:s.step<2?`<div class="jm-check-options"><button data-action="okay" class="good" aria-pressed="${s.answer==='Okay'}">✓ Looks okay</button><button data-action="problem" class="bad" aria-pressed="${s.answer==='Problem'}">! Needs attention</button></div><div class="jm-choice-status" aria-live="polite">${s.answer?(s.answer==='Okay'?'✓ Okay recorded. Save and move on.':'! Problem recorded. Director review will be requested.'):'Choose one answer to continue.'}</div>`:`<div class="jm-status">✓ Two equipment checks recorded in this mock</div>`,cta:s.step<2?'Save & next appliance →':'Send walkthrough to Director →',next:'Full photos, readings and equipment history are one tap away.'};}
return {tag:`SUBCONTRACTOR · ${s.step===0?'ASSIGNED TO YOU':s.step===1?'WORK IN PROGRESS':'DIRECTOR REVIEW'}`,title:s.step===0?'Service the refrigerator.':s.step===1?'Show what you did.':'Send it for approval.',body:s.step===0?'Mercer Kitchen · Kitchen · Due today. Preventive service assigned by the Director.':s.step===1?'Add a completion photo and a short work note.':'The Director reviews the result before the job is closed.',form:`<div class="jm-status">Owner: Sam · Reviewer: Director</div>${s.step===1?'<div class="jm-form"><label class="full">Work note<input aria-label="Work note" value="Service completed; result documented"></label></div><p>Completion photo attached · illustrative example</p>':''}`,cta:s.step===0?'Start assigned work →':s.step===1?'Add evidence & continue →':'Send to Director for approval →',next:'The work stays linked to the same refrigerator record.'};}
function action(s,c,extra=''){return `<div class="jm-action ${extra}"><div class="jm-kicker">${c.tag}</div><h1>${c.title}</h1><p>${c.body}</p>${c.form}<div class="jm-next"><button class="jm-primary" data-action="next" ${s.role==='Manager'&&s.step<2&&!s.answer?'disabled':''}>${c.cta}</button><small>${c.next}</small></div></div>`;}
function urgent(s){if(s.assigned)return `<div class="jm-urgent" style="background:var(--j-green-bg);color:var(--j-green);border-color:var(--j-green)"><strong>✓ Request assigned · Subcontractor is next</strong></div>`;return `<div class="jm-urgent"><div><strong>! NEEDS YOUR DECISION · 1 overdue repair request</strong><small>Walk-in refrigerator · Mercer Kitchen · fictional example</small></div><button class="jm-danger" data-action="urgent">${s.urgent?'Hide request':'Review request →'}</button></div>${s.urgent?'<div class="jm-alert-detail"><span class="jm-status">DIRECTOR DECISION REQUIRED</span><h2>Manager reported unusual cooling.</h2><p>Equipment: EQ-0017 · Finding and photo linked to the request.</p><button class="jm-primary" data-action="assign">Assign a subcontractor →</button></div>':''}`;}
function render(el,key){const s=states[key],c=content(s);let main='';
if(key==='focus')main=`<div class="jm-context">NEW RESTAURANT SETUP · ONE ACTION AT A TIME</div>${strip(s)}${action(s,c)}${detail(s)}`;
if(key==='signal')main=`${s.role==='Director'?urgent(s):''}<div class="jm-priority"><div class="jm-signal-stack"><div class="jm-signal red">NEEDS DECISION<strong>${s.assigned?'0':'1'} urgent</strong></div><div class="jm-signal amber">DO TODAY<strong>Kitchen setup</strong></div><div class="jm-signal green">COMPLETE<strong>${s.step} steps</strong></div></div><div>${action(s,c)}${detail(s)}</div></div>`;
if(key==='ticket')main=`<div class="jm-ticket"><div class="jm-ticket-head"><span>JOB TICKET · ${s.role.toUpperCase()}</span><span>${s.step+1} / 3</span></div><div class="jm-ticket-body"><div class="jm-kicker">DO THIS NEXT</div><h1>${c.title}</h1><p>${c.body}</p>${c.form}<button class="jm-primary" data-action="next" ${s.role==='Manager'&&s.step<2&&!s.answer?'disabled':''}>${c.cta}</button>${detail(s)}</div><div class="jm-ticket-foot">NEXT HANDOFF: ${s.role==='Director'?'Manager':s.role==='Manager'?'Director reviews findings':'Director approves work'} · ${c.next}</div></div>`;
if(key==='lanes')main=`<div class="jm-context">YOUR WORK, IN THE ORDER IT NEEDS TO HAPPEN.</div><div class="jm-lanes"><div class="jm-lane"><div class="jm-lane-label">DO NOW <span>${s.step+1} / 3</span></div><h2>${c.title}</h2><p>${c.body}</p>${c.form}<button class="jm-primary" data-action="next" ${s.role==='Manager'&&s.step<2&&!s.answer?'disabled':''}>${c.cta}</button></div><div class="jm-lane next"><div class="jm-lane-label">DO NEXT</div><h2>${s.role==='Director'?(s.step===0?'Photograph equipment.':s.step===1?'Assign the Manager.':'Run inspections.'):s.role==='Manager'?'Send findings.':'Director review.'}</h2><p>${c.next}</p></div><div class="jm-lane done"><div class="jm-lane-label">DONE</div><h2>${s.step?'✓ '+s.step+' steps finished':'Nothing yet.'}</h2><p>${s.step?'Your completed steps stay in the record.':'Start with the blue button. No setup knowledge needed.'}</p></div></div>${detail(s)}`;
if(key==='route'){const labels=s.role==='Director'?['Register restaurant','Document equipment','Assign Manager']:s.role==='Manager'?['Refrigerator','Gas range','Send findings']:['Start assigned job','Document the work','Director review'];main=`<div class="jm-context">YOU ARE HERE → ${labels[s.step].toUpperCase()}</div><div class="jm-route"><div class="jm-stations">${labels.map((n,i)=>`<div class="jm-station ${i===s.step?'current':i<s.step?'done':''}"><span>${i<s.step?'✓':i+1}</span><div><strong>${n}</strong><small>${i===s.step?'CURRENT ACTION':i<s.step?'COMPLETE':'COMING NEXT'}</small></div></div>`).join('')}</div><div>${action(s,c)}${detail(s)}</div></div>`;}
el.innerHTML=header(s)+`<main class="jm-main">${main}<div class="jm-bottom"><button data-action="prefer">Choose “${designs[key]}”</button><span class="jm-choice-status" aria-live="polite">${s.message||''}</span></div></main><footer class="jm-mode-note">Interactive concept · fictional records · no Supabase writes or real image uploads</footer>`;
const styling=styleStates[key];el.style.setProperty('--j-radius',styling.radius+'px');el.style.setProperty('--j-target',styling.bigTargets?'56px':'44px');}
for(const el of root.querySelectorAll('.jm-product')){const key=el.dataset.design;const old=saved[key]||{};states[key]={role:['Director','Manager','Subcontractor'].includes(old.role)?old.role:'Director',step:Math.max(0,Math.min(2,old.step||0)),answer:old.answer||'',urgent:!!old.urgent,assigned:false,message:''};styleStates[key]={bigTargets:true,radius:key==='ticket'?2:8};render(el,key);el.addEventListener('change',event=>{if(event.target.dataset.action==='role'){states[key].role=event.target.value;states[key].step=0;states[key].answer='';states[key].message='';render(el,key);remember();}});el.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const s=states[key],a=button.dataset.action;if(a==='next'){if(s.role==='Manager'&&s.step<2&&!s.answer)return;if(s.step<2){s.step++;s.answer='';s.message='Next action opened. Mock only; nothing was uploaded.';}else if(s.role==='Director'){s.role='Manager';s.step=0;s.message='Manager interface opened.';}else{s.message=s.role==='Manager'?'Mock walkthrough sent. Director reviews next.':'Mock job submitted. Director approves next.';}}if(a==='okay')s.answer='Okay';if(a==='problem')s.answer='Problem';if(a==='urgent')s.urgent=!s.urgent;if(a==='assign'){s.urgent=false;s.assigned=true;s.message='Mock assignment created. Subcontractor is next.';}if(a==='prefer'){s.message='Preferred direction noted: '+designs[key];remember(designs[key]);render(el,key);return;}render(el,key);remember();});if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:()=>render(el,key)});tweak.addToggle(styleStates[key],'bigTargets',{label:'Large field buttons'});tweak.addSlider(styleStates[key],'radius',{label:'Button corners',min:0,max:18,unit:'px'});}}
window.addEventListener('openai:set_globals',event=>{const data=event.detail?.globals?.widgetState?.privateContent;if(!data)return;for(const [key,value] of Object.entries(data)){if(!states[key])continue;const s=states[key];if(['Director','Manager','Subcontractor'].includes(value.role))s.role=value.role;if(Number.isInteger(value.step))s.step=Math.max(0,Math.min(2,value.step));s.answer=value.answer||'';s.urgent=!!value.urgent;const el=root.querySelector('[data-design="'+key+'"]');if(el)render(el,key);}});
})();
</script>
<script>(()=>{const root=document.getElementById('juggle-five-mocks');const sections=Array.from(root.children).filter(x=>x.hasAttribute('data-variant'));const buttons=Array.from(document.querySelectorAll('[data-concept]'));function show(n){sections.forEach((x,i)=>{x.hidden=i!==n});buttons.forEach((x,i)=>x.setAttribute('aria-pressed',String(i===n)));history.replaceState(null,'','#option-'+(n+1))}buttons.forEach((b,i)=>b.addEventListener('click',()=>show(i)));const initial=Number(location.hash.replace('#option-',''))-1;show(initial>=0&&initial<5?initial:0)})();</script></body></html>
